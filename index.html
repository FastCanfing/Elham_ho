<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد اشتراک</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 16px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .wrapper { width: 100%; max-width: 480px; }
        
        .main-card { background: #ffffff; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 12px; }
        
        .middle-section { display: flex; justify-content: space-between; align-items: center; }
        .stats-list { display: flex; flex-direction: column; gap: 8px; }
        .stat-row { font-size: 13px; color: #666; display: flex; gap: 15px; justify-content: space-between; width: 210px; }
        .stat-row strong { color: #111; direction: ltr; }
        
        /* دایره درصد پیشرفت پویا */
        .circle-progress { width: 75px; height: 75px; border-radius: 50%; background: conic-gradient(#10b981 0deg, #edf2f7 0deg); display: flex; align-items: center; justify-content: center; position: relative; }
        .circle-progress::after { content: ""; width: 61px; height: 61px; background: #ffffff; border-radius: 50%; position: absolute; }
        .circle-content { position: relative; z-index: 1; text-align: center; }
        .circle-num { font-size: 13px; font-weight: bold; color: #111; display: block; }
        .circle-label { font-size: 9px; color: #777; display: block; }

        .sub-link-card { background: #ffffff; border-radius: 16px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 12px; }
        .sub-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .sub-title { font-weight: bold; font-size: 13px; color: #444; display: flex; align-items: center; gap: 6px; }
        .btn-group { display: flex; gap: 8px; }
        .action-btn { background: #f1f5f9; border: none; padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 12px; color: #334155; font-weight: bold; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .action-btn:hover { background: #e2e8f0; }
        .action-btn.primary { background: #10b981; color: #fff; }
        .action-btn.primary:hover { background: #059669; }

        .qrcode-container { display: flex; justify-content: center; align-items: center; margin-top: 10px; display: none; }
        .qrcode-container img { border-radius: 8px; padding: 5px; background: #fff; border: 1px solid #eee; }

        .apps-card { background: #ffffff; border-radius: 16px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 12px; }
        .accordion-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 13px; font-weight: bold; color: #444; padding: 6px 0; }
        .accordion-content { display: none; margin-top: 10px; border-top: 1px solid #f0f0f0; padding-top: 10px; }
        .app-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; }
        .app-info { display: flex; align-items: center; gap: 8px; }
        .app-name { font-size: 12px; font-weight: bold; color: #333; }
        .badge-suggest { background: #e0f2fe; color: #0284c7; font-size: 10px; padding: 2px 6px; border-radius: 6px; font-weight: bold; }
        .dl-btn { background: #e2e8f0; color: #334155; padding: 6px 14px; border-radius: 8px; text-decoration: none; font-size: 11px; font-weight: bold; }

        .support-card { background: #ffffff; border-radius: 16px; padding: 14px 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .support-title { font-weight: bold; font-size: 13px; color: #555; }
        .support-link { color: #0088cc; font-weight: bold; font-size: 13px; text-decoration: none; direction: ltr; background: #e0f2fe; padding: 6px 12px; border-radius: 10px; }

        .thank-you-box { background: linear-gradient(135deg, #ecfdf5, #d1fae5); border: 1px dashed #10b981; border-radius: 16px; padding: 14px; text-align: center; color: #065f46; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="main-card">
        <div class="middle-section">
            <div class="stats-list">
                <div class="stat-row"><span>حجم سرویس:</span> <strong id="totalText">0 GB</strong></div>
                <div class="stat-row"><span>حجم مصرفی:</span> <strong id="usedText">0 GB</strong></div>
                <div class="stat-row"><span>حجم باقی‌مانده:</span> <strong id="remainingText" style="color: #10b981;">0 GB</strong></div>
            </div>
            <div class="circle-progress" id="circleProgress">
                <div class="circle-content">
                    <span class="circle-num" id="percentText">0%</span>
                    <span class="circle-label">مصرف شده</span>
                </div>
            </div>
        </div>
    </div>

    <div class="sub-link-card">
        <div class="sub-header">
            <span class="sub-title">🔗 لینک اشتراک (SUB)</span>
            <div class="btn-group">
                <button class="action-btn" onclick="toggleQR()">🔲 QR</button>
                <button class="action-btn primary" id="copyBtn" onclick="copySubLink()">کپی لینک</button>
            </div>
        </div>
        <div class="qrcode-container" id="qrcode"></div>
    </div>

    <div class="apps-card">
        <div class="accordion-header" onclick="toggleAccordion('iosApps')">
            <span>🍏 iOS (آیفون)</span>
            <span>▼</span>
        </div>
        <div class="accordion-content" id="iosApps" style="display: block;">
            <div class="app-item">
                <div class="app-info">
                    <span class="app-name">Streisand</span>
                    <span class="badge-suggest">پیشنهادی</span>
                </div>
                <a href="https://apps.apple.com/us/app/streisand/id6443341737" class="dl-btn" target="_blank">دانلود</a>
            </div>
        </div>

        <div class="accordion-header" onclick="toggleAccordion('androidApps')" style="margin-top: 10px;">
            <span>🤖 اندروید</span>
            <span>▼</span>
        </div>
        <div class="accordion-content" id="androidApps">
            <div class="app-item">
                <div class="app-info">
                    <span class="app-name">v2rayNG</span>
                    <span class="badge-suggest">پیشنهادی</span>
                </div>
                <a href="https://github.com/2dust/v2rayNG/releases" class="dl-btn" target="_blank">دانلود</a>
            </div>
        </div>

        <div class="accordion-header" onclick="toggleAccordion('windowsApps')" style="margin-top: 10px;">
            <span>💻 ویندوز</span>
            <span>▼</span>
        </div>
        <div class="accordion-content" id="windowsApps">
            <div class="app-item">
                <div class="app-info">
                    <span class="app-name">v2rayN</span>
                </div>
                <a href="https://github.com/2dust/v2rayN/releases" class="dl-btn" target="_blank">دانلود</a>
            </div>
        </div>
    </div>

    <div class="support-card">
        <span class="support-title">پشتیبانی تلگرام</span>
        <a href="https://t.me/Turbo_Canfing" target="_blank" class="support-link">@Turbo_Canfing</a>
    </div>

    <div class="thank-you-box">
        🙏 بابت خرید و اعتماد شما سپاسگزاریم
    </div>
</div>

<script>
    // لینک اشتراک خود را اینجا قرار دهید
    const subLink = "https://raw.githubusercontent.com/FastCanfing/Elham_ho/refs/heads/main/sub.txt";

    // تنظیم حجم‌ها بر اساس گیگابایت (فقط همین دو مقدار را برای هر مشتری تغییر دهید)
    const totalGB = 10.0; // حجم کل سرویس
    const usedGB = 4.48;   // حجم مصرف شده توسط کاربر

    // محاسبات خودکار حجم باقی‌مانده و درصد پیشرفت
    const remainingGB = Math.max(0, totalGB - usedGB);
    const percent = totalGB > 0 ? Math.min(100, Math.round((usedGB / totalGB) * 100)) : 0;

    // نمایش مقادیر در صفحه
    document.getElementById('totalText').innerText = totalGB.toFixed(2) + " GB";
    document.getElementById('usedText').innerText = usedGB.toFixed(2) + " GB";
    document.getElementById('remainingText').innerText = remainingGB.toFixed(2) + " GB";
    document.getElementById('percentText').innerText = percent + "%";

    // آپدیت گرافیکی دایره درصد مصرف
    const degree = (percent / 100) * 360;
    document.getElementById('circleProgress').style.background = `conic-gradient(#10b981 ${degree}deg, #edf2f7 0deg)`;

    // ساخت QR کد
    let qrGenerated = false;
    function toggleQR() {
        const qrContainer = document.getElementById('qrcode');
        if (qrContainer.style.display === 'flex') {
            qrContainer.style.display = 'none';
        } else {
            qrContainer.style.display = 'flex';
            if (!qrGenerated) {
                new QRCode(qrContainer, {
                    text: subLink,
                    width: 150,
                    height: 150,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
                qrGenerated = true;
            }
        }
    }

    function copySubLink() {
        navigator.clipboard.writeText(subLink).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "کپی شد! ✓";
            btn.style.background = "#059669";
            setTimeout(() => {
                btn.innerText = "کپی لینک";
                btn.style.background = "#10b981";
            }, 2000);
        });
    }

    function toggleAccordion(id) {
        const content = document.getElementById(id);
        content.style.display = content.style.display === 'block' ? 'none' : 'block';
    }
</script>

</body>
</html>
