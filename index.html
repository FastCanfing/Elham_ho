<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد اشتراک اختصاصی</title>
    <!-- کتابخانه ساخت QR کد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { 
            background: #090d16;
            background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, #090d16 100%);
            color: #f8fafc; 
            padding: 40px 16px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .wrapper { width: 100%; max-width: 420px; }
        
        /* کارت‌های شیشه‌ای فوق‌العاده لوکس */
        .card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 22px; 
            padding: 20px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); 
            margin-bottom: 14px; 
            transition: all 0.3s ease;
        }
        .card:hover {
            border-color: rgba(16, 185, 129, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* مدت زمان اشتراک */
        .sub-time-card { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 14px; 
            color: #94a3b8; 
            font-weight: 500;
        }
        .badge-time { 
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.1));
            color: #34d399;
            padding: 6px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: inline-flex;
            gap: 6px;
            align-items: center;
            letter-spacing: 0.5px;
        }

        /* بخش لینک اشتراک و QR کد */
        .sub-header { display: flex; justify-content: space-between; align-items: center; }
        .sub-title { font-weight: 700; font-size: 14px; color: #f8fafc; display: flex; align-items: center; gap: 8px; }
        .btn-group { display: flex; gap: 8px; }
        
        .action-btn { 
            background: rgba(255, 255, 255, 0.06); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 9px 16px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 13px; 
            color: #e2e8f0; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .action-btn:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-2px); }
        .action-btn.primary { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; border: none; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
        .action-btn.primary:hover { background: linear-gradient(135deg, #059669 0%, #047857 100%); }

        .qrcode-container { display: flex; justify-content: center; align-items: center; margin-top: 18px; display: none; animation: fadeIn 0.4s ease; }
        .qrcode-container img { border-radius: 14px; padding: 12px; background: #ffffff; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* بخش اپلیکیشن‌ها (آکاردئونی مدرن) */
        .accordion-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 600; 
            color: #cbd5e1; 
            padding: 10px 0; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: color 0.2s;
        }
        .accordion-header:hover { color: #34d399; }
        .accordion-header:last-of-type { border-bottom: none; }
        .arrow-icon { font-size: 11px; color: #64748b; transition: transform 0.3s ease; }
        
        .accordion-content { display: none; margin-top: 12px; padding-top: 4px; }
        .app-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(15, 23, 42, 0.5); 
            padding: 12px 16px; 
            border-radius: 14px; 
            margin-bottom: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s;
        }
        .app-item:hover { background: rgba(15, 23, 42, 0.8); }
        .app-info { display: flex; align-items: center; gap: 10px; }
        .app-name { font-size: 13px; font-weight: 700; color: #f8fafc; }
        .badge-suggest { background: rgba(56, 189, 248, 0.1); color: #38bdf8; font-size: 10px; padding: 4px 8px; border-radius: 8px; font-weight: 700; border: 1px solid rgba(56, 189, 248, 0.2); }
        .dl-btn { 
            background: rgba(255, 255, 255, 0.06); 
            color: #e2e8f0; 
            padding: 7px 16px; 
            border-radius: 10px; 
            text-decoration: none; 
            font-size: 12px; 
            font-weight: 600; 
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .dl-btn:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }

        /* بخش پشتیبانی */
        .support-card { display: flex; justify-content: space-between; align-items: center; }
        .support-title { font-weight: 600; font-size: 13px; color: #94a3b8; }
        .support-link { color: #38bdf8; font-weight: 700; font-size: 13px; text-decoration: none; direction: ltr; background: rgba(56, 189, 248, 0.08); padding: 7px 16px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.2); transition: all 0.2s; }
        .support-link:hover { background: rgba(56, 189, 248, 0.15); transform: translateY(-1px); }

        /* باکس تشکر آخر با گرادنت خیره‌کننده */
        .thank-you-box { 
            background: linear-gradient(135deg, #10b981 0%, #047857 100%); 
            border-radius: 20px; 
            padding: 18px; 
            text-align: center; 
            color: #ffffff; 
            font-size: 13px; 
            font-weight: 600; 
            box-shadow: 0 15px 30px rgba(16, 185, 129, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- مدت زمان اشتراک -->
    <div class="card sub-time-card">
        <span>مدت زمان اشتراک</span>
        <div class="badge-time">
            <span>۲</span>
            <span>ماه</span>
        </div>
    </div>

    <!-- لینک اشتراک و QR کد -->
    <div class="card">
        <div class="sub-header">
            <span class="sub-title">🔗 لینک اشتراک (SUB)</span>
            <div class="btn-group">
                <button class="action-btn" onclick="toggleQR()">🔲 QR</button>
                <button class="action-btn primary" id="copyBtn" onclick="copySubLink()">کپی لینک</button>
            </div>
        </div>
        <div class="qrcode-container" id="qrcode"></div>
    </div>

    <!-- اپلیکیشن‌های پیشنهادی -->
    <div class="card">
        <div class="accordion-header" onclick="toggleAccordion('iosApps')">
            <span>🍏 iOS (آیفون)</span>
            <span class="arrow-icon" id="arrow-iosApps">▼</span>
        </div>
        <div class="accordion-content" id="iosApps" style="display: block;">
            <div class="app-item">
                <div class="app-info">
                    <span class="app-name">Streisand</span>
                    <span class="badge-suggest">پیشنهادی</span>
                </div>
                <a href="https://apps.apple.com/us/app/streisand/id6443341737" class="dl-btn" target="_blank">دانلود</a>
            </div>
        </div>

        <div class="accordion-header" onclick="toggleAccordion('androidApps')" style="margin-top: 6px;">
            <span>🤖 اندروید</span>
            <span class="arrow-icon" id="arrow-androidApps">▼</span>
        </div>
        <div class="accordion-content" id="androidApps">
            <div class="app-item">
                <div class="app-info"><span class="app-name">v2rayNG</span></div>
                <a href="https://github.com/2dust/v2rayNG/releases" class="dl-btn" target="_blank">دانلود</a>
            </div>
        </div>

        <div class="accordion-header" onclick="toggleAccordion('windowsApps')" style="margin-top: 6px;">
            <span>💻 ویندوز</span>
            <span class="arrow-icon" id="arrow-windowsApps">▼</span>
        </div>
        <div class="accordion-content" id="windowsApps">
            <div class="app-item">
                <div class="app-info"><span class="app-name">v2rayN</span></div>
                <a href="https://github.com/2dust/v2rayN/releases" class="dl-btn" target="_blank">دانلود</a>
            </div>
        </div>
    </div>

    <!-- پشتیبانی تلگرام -->
    <div class="card support-card">
        <span class="support-title">پشتیبانی تلگرام</span>
        <a href="https://t.me/Turbo_Canfing" target="_blank" class="support-link">@Turbo_Canfing</a>
    </div>

    <!-- باکس تشکر -->
    <div class="thank-you-box">
        🙏 بابت خرید و اعتماد شما متشکرم
    </div>
</div>

<script>
    // لینک اشتراک خود را اینجا قرار دهید
    const subLink = "https://raw.githubusercontent.com/FastCanfing/Elham_ho/refs/heads/main/sub.txt";

    // ساخت QR کد
    let qrGenerated = false;
    function toggleQR() {
        const qrContainer = document.getElementById('qrcode');
        if (qrContainer.style.display === 'flex') {
            qrContainer.style.display = 'none';
        } else {
            qrContainer.style.display = 'flex';
            if (!qrGenerated) {
                new QRCode(qrContainer, {
                    text: subLink,
                    width: 140,
                    height: 140,
                    colorDark : "#0f172a",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
                qrGenerated = true;
            }
        }
    }

    // کپی کردن لینک
    function copySubLink() {
        navigator.clipboard.writeText(subLink).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "کپی شد! ✓";
            btn.style.background = "#059669";
            setTimeout(() => {
                btn.innerText = "کپی لینک";
                btn.style.background = "linear-gradient(135deg, #10b981 0%, #059669 100%)";
            }, 2000);
        });
    }

    // باز و بسته کردن منوی برنامه‌ها
    function toggleAccordion(id) {
        const content = document.getElementById(id);
        const arrow = document.getElementById('arrow-' + id);
        if (content.style.display === 'block') {
            content.style.display = 'none';
            arrow.style.transform = 'rotate(0deg)';
        } else {
            content.style.display = 'block';
            arrow.style.transform = 'rotate(180deg)';
        }
    }
</script>

</body>
</html>
