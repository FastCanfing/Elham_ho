<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد اشتراک اختصاصی</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { 
            background: #0b0f19;
            color: #f8fafc; 
            padding: 30px 16px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            transition: background 0.5s ease;
        }
        .wrapper { width: 100%; max-width: 420px; }
        .brand-title {
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px; 
            padding: 20px 22px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); 
            margin-bottom: 14px; 
        }
        .usage-section { font-size: 13px; color: #94a3b8; font-weight: 500; }
        .progress-bar-container { 
            width: 100%; height: 10px; background: rgba(255, 255, 255, 0.06); 
            border-radius: 6px; overflow: hidden; margin: 10px 0 14px 0; 
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%); border-radius: 6px; transition: width 1s ease-in-out; }
        .sub-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .sub-title { font-weight: 700; font-size: 14px; color: #f8fafc; display: flex; align-items: center; gap: 8px; }
        .btn-group { display: flex; gap: 8px; }
        .action-btn { 
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 8px 14px; border-radius: 12px; cursor: pointer; font-size: 13px; 
            color: #e2e8f0; font-weight: 600; display: flex; align-items: center; gap: 6px; 
        }
        .action-btn.primary { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: #fff; border: none; }
        .link-box-input {
            width: 100%; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 10px 14px; color: #38bdf8; font-size: 12px; direction: ltr; text-align: left; outline: none;
        }
        .qrcode-container { display: flex; justify-content: center; align-items: center; margin-top: 15px; display: none; }
        .qrcode-container img { border-radius: 16px; padding: 12px; background: #ffffff; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .os-section { margin-bottom: 6px; }
        .accordion-header { 
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; 
            font-size: 14px; font-weight: 600; color: #cbd5e1; padding: 12px 14px; 
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px; margin-bottom: 8px; transition: all 0.2s ease;
        }
        .accordion-header.active-os { background: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.3); color: #f8fafc; }
        .arrow-icon { font-size: 11px; color: #64748b; transition: transform 0.3s ease; }
        .accordion-content { display: none; margin-top: 6px; margin-bottom: 10px; padding: 0 4px; }
        .app-item { 
            display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.6); 
            padding: 12px 16px; border-radius: 14px; margin-bottom: 8px; border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .app-info { display: flex; align-items: center; gap: 10px; }
        .app-name { font-size: 13px; font-weight: 700; color: #f8fafc; }
        .badge-suggest { background: rgba(56, 189, 248, 0.12); color: #38bdf8; font-size: 10px; padding: 4px 8px; border-radius: 8px; font-weight: 700; }
        .dl-btn { 
            background: rgba(255, 255, 255, 0.06); color: #e2e8f0; padding: 7px 16px; border-radius: 10px; 
            text-decoration: none; font-size: 12px; font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .dl-btn.latest { background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(99, 102, 241, 0.2)); border-color: rgba(56, 189, 248, 0.3); color: #38bdf8; }
        .support-card { display: flex; justify-content: space-between; align-items: center; }
        .support-title { font-weight: 600; font-size: 13px; color: #94a3b8; }
        .support-link { color: #38bdf8; font-weight: 700; font-size: 13px; text-decoration: none; direction: ltr; background: rgba(56, 189, 248, 0.08); padding: 7px 16px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.2); }
        .thank-you-box { 
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); border-radius: 20px; 
            padding: 18px; text-align: center; color: #ffffff; font-size: 13px; font-weight: 600; 
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- ✏️ [۱- نام اکانت/برند]: اسم خود را در خط زیر وارد کنید -->
    <div class="brand-title">Elham_ho</div>

    <!-- مدت زمان و حجم سرویس -->
    <div class="card usage-section" style="display: flex; justify-content: space-between; align-items: center;">
        <span style="color: #94a3b8;">مدت زمان</span>
        <!-- ✏️ [2- مدت زمان اشتراک]: مقدار دلخواه (مثل ۲ ماه) را در خط زیر تغییر دهید -->
        <b style="background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; padding: 6px 14px; border-radius: 12px; font-size: 12px;">۲ ماه</b>
        <span style="color: #94a3b8;">حجم سرویس</span>
        <!-- ✏️ [10- حجم سرویس]: مقدار حجم (مثل ۱۰ گیگ) را در خط زیر تغییر دهید -->
        <b style="background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 6px 14px; border-radius: 12px; font-size: 12px; border: 1px solid rgba(56, 189, 248, 0.3);">۱۰ گیگ</b>
    </div>

    <!-- لینک اشتراک -->
    <div class="card">
        <div class="sub-header">
            <span class="sub-title">🔗 لینک اشتراک (SUB)</span>
            <div class="btn-group">
                <button class="action-btn" onclick="toggleQR()">🔲 QR</button>
                <button class="action-btn primary" id="copyBtn" onclick="copySubLink()">کپی لینک</button>
            </div>
        </div>
        <input type="text" id="subLinkInput" class="link-box-input" readonly onclick="this.select()">
        <div class="qrcode-container" id="qrcode"></div>
    </div>

    <!-- بخش برنامه‌ها -->
    <div class="card">
        <div class="os-section">
            <div class="accordion-header" id="header-iosApps" onclick="toggleAccordion('iosApps')">
                <span>🍏 iOS (آیفون)</span>
                <span class="arrow-icon" id="arrow-iosApps">▼</span>
            </div>
            <div class="accordion-content" id="iosApps">
                <div class="app-item">
                    <div class="app-info"><span class="app-name">Streisand</span><span class="badge-suggest">پیشنهادی</span></div>
                    <a href="https://apps.apple.com/us/app/streisand/id6443341737" class="dl-btn latest" target="_blank">دانلود</a>
                </div>
            </div>
        </div>

        <div class="os-section">
            <div class="accordion-header" id="header-androidApps" onclick="toggleAccordion('androidApps')">
                <span>🤖 اندروید</span>
                <span class="arrow-icon" id="arrow-androidApps">▼</span>
            </div>
            <div class="accordion-content" id="androidApps">
                <div class="app-item">
                    <div class="app-info"><span class="app-name">v2rayNG</span><span class="badge-suggest">پیشنهادی</span></div>
                    <a href="https://github.com/2dust/v2rayNG/releases/latest" class="dl-btn latest" target="_blank">دانلود</a>
                </div>
            </div>
        </div>

        <div class="os-section">
            <div class="accordion-header" id="header-windowsApps" onclick="toggleAccordion('windowsApps')">
                <span>💻 ویندوز</span>
                <span class="arrow-icon" id="arrow-windowsApps">▼</span>
            </div>
            <div class="accordion-content" id="windowsApps">
                <div class="app-item">
                    <div class="app-info"><span class="app-name">v2rayN</span><span class="badge-suggest">پیشنهادی</span></div>
                    <a href="https://github.com/2dust/v2rayN/releases/latest" class="dl-btn latest" target="_blank">دانلود</a>
                </div>
            </div>
        </div>
    </div>

    <div class="card support-card">
        <span class="support-title">پشتیبانی تلگرام</span>
        <a href="https://t.me/Turbo_Canfing" target="_blank" class="support-link">@Turbo_Canfing</a>
    </div>

    <div class="thank-you-box">
        🙏 بابت خرید و اعتماد شما متشکرم
    </div>
</div>

<script>
    // ۲۰ پالت رنگی مختلف با رنگ‌های روشن، زنده و جذاب
    const colorPalettes = [
        { bg: "#0d1b2a", c1: "rgba(56, 189, 248, 0.35)", c2: "rgba(129, 140, 248, 0.35)", c3: "rgba(52, 211, 153, 0.3)" }, // آبی و سبز روشن
        { bg: "#1f1d2b", c1: "rgba(244, 63, 94, 0.35)", c2: "rgba(236, 72, 153, 0.35)", c3: "rgba(168, 85, 247, 0.35)" }, // صورتی و بنفش روشن
        { bg: "#111827", c1: "rgba(251, 191, 36, 0.35)", c2: "rgba(249, 115, 22, 0.35)", c3: "rgba(244, 63, 94, 0.3)" }, // کهربایی و نارنجی روشن
        { bg: "#06202a", c1: "rgba(45, 212, 191, 0.35)", c2: "rgba(56, 189, 248, 0.35)", c3: "rgba(147, 197, 253, 0.35)" }, // فیروزه‌ای و آبی آسمانی
        { bg: "#18122b", c1: "rgba(192, 132, 252, 0.35)", c2: "rgba(244, 114, 182, 0.35)", c3: "rgba(129, 140, 248, 0.35)" }, // ارکیده‌ای و صورتی روشن
        { bg: "#052e16", c1: "rgba(74, 222, 128, 0.35)", c2: "rgba(52, 211, 153, 0.35)", c3: "rgba(250, 204, 21, 0.35)" }, // سبز یشمی و لیمویی روشن
        { bg: "#2a0808", c1: "rgba(248, 113, 113, 0.35)", c2: "rgba(251, 146, 60, 0.35)", c3: "rgba(250, 204, 21, 0.35)" }, // قرمز و سرخابی روشن
        { bg: "#170f26", c1: "rgba(168, 85, 247, 0.35)", c2: "rgba(99, 102, 241, 0.35)", c3: "rgba(236, 72, 153, 0.35)" }, // بنفش و نیلی روشن
        { bg: "#042f2e", c1: "rgba(45, 212, 191, 0.35)", c2: "rgba(74, 222, 128, 0.35)", c3: "rgba(56, 189, 248, 0.35)" }, // سبز آبی روشن و نعنایی
        { bg: "#291b07", c1: "rgba(251, 191, 36, 0.35)", c2: "rgba(251, 146, 60, 0.35)", c3: "rgba(234, 179, 8, 0.35)" }, // طلایی و خردلی روشن
        { bg: "#20062a", c1: "rgba(217, 70, 239, 0.35)", c2: "rgba(168, 85, 247, 0.35)", c3: "rgba(244, 114, 182, 0.35)" }, // سرخابی و بنفش نئونی
        { bg: "#041c2c", c1: "rgba(56, 189, 248, 0.4)", c2: "rgba(34, 211, 238, 0.35)", c3: "rgba(129, 140, 248, 0.35)" }, // آبی الکتریک و سایان
        { bg: "#2b0b18", c1: "rgba(251, 113, 133, 0.35)", c2: "rgba(244, 63, 94, 0.35)", c3: "rgba(217, 70, 239, 0.35)" }, // رزی و صورتی روشن
        { bg: "#062312", c1: "rgba(52, 211, 153, 0.35)", c2: "rgba(74, 222, 128, 0.35)", c3: "rgba(45, 212, 191, 0.35)" }, // سبز جنگلی روشن
        { bg: "#1f1604", c1: "rgba(250, 204, 21, 0.35)", c2: "rgba(251, 191, 36, 0.35)", c3: "rgba(251, 146, 60, 0.35)" }, // زرد و نارنجی آفتابی
        { bg: "#120826", c1: "rgba(139, 92, 246, 0.35)", c2: "rgba(192, 132, 252, 0.35)", c3: "rgba(56, 189, 248, 0.35)" }, // بنفش سلطنتی روشن
        { bg: "#2a1506", c1: "rgba(251, 146, 60, 0.35)", c2: "rgba(248, 113, 113, 0.35)", c3: "rgba(250, 204, 21, 0.35)" }, // هلویی و مرجانی روشن
        { bg: "#051c24", c1: "rgba(34, 211, 238, 0.35)", c2: "rgba(45, 212, 191, 0.35)", c3: "rgba(99, 102, 241, 0.35)" }, // آبی اقیانوسی روشن
        { bg: "#26061b", c1: "rgba(236, 72, 153, 0.35)", c2: "rgba(244, 114, 182, 0.35)", c3: "rgba(168, 85, 247, 0.35)" }, // سرخابی پاستلی و روشن
        { bg: "#0d2018", c1: "rgba(74, 222, 128, 0.35)", c2: "rgba(34, 211, 238, 0.35)", c3: "rgba(52, 211, 153, 0.35)" } // سبز چمنی و آبی روشن
    ];

    const selectedPalette = colorPalettes[Math.floor(Math.random() * colorPalettes.length)];
    document.body.style.backgroundColor = selectedPalette.bg;
    document.body.style.backgroundImage = `
        radial-gradient(circle at 15% 15%, ${selectedPalette.c1} 0%, transparent 50%),
        radial-gradient(circle at 85% 85%, ${selectedPalette.c2} 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, ${selectedPalette.c3} 0%, transparent 65%)
    `;

    // ✏️ [۴- لینک ساب‌سکریپشن]: لینک ساب مشتری را بین علامت‌های نقل قول (" ") در خط زیر جایگذاری کنید
    const subLink = "https://racocloud.com/sub/djMsMTA2MzEsMTc4NDMxMDgyNQ6aa23c3aa0";
    
    document.getElementById('subLinkInput').value = subLink;

    let qrGenerated = false;
    function toggleQR() {
        const qrContainer = document.getElementById('qrcode');
        if (qrContainer.style.display === 'flex') {
            qrContainer.style.display = 'none';
        } else {
            qrContainer.style.display = 'flex';
            if (!qrGenerated) {
                new QRCode(qrContainer, { text: subLink, width: 150, height: 150, colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.M });
                qrGenerated = true;
            }
        }
    }

    function copySubLink() {
        const inputElement = document.getElementById('subLinkInput');
        inputElement.select();
        inputElement.setSelectionRange(0, 99999);
        try {
            document.execCommand('copy');
            const btn = document.getElementById('copyBtn');
            btn.innerText = "کپی شد! ✓";
            btn.style.background = "#059669";
            setTimeout(() => {
                btn.innerText = "کپی لینک";
                btn.style.background = "linear-gradient(135deg, #6366f1 0%, #a855f7 100%)";
            }, 2000);
        } catch (err) {
            prompt("لینک اشتراک شما:", subLink);
        }
    }

    function toggleAccordion(id) {
        const content = document.getElementById(id);
        const arrow = document.getElementById('arrow-' + id);
        if (content.style.display === 'block') {
            content.style.display = 'none';
            arrow.style.transform = 'rotate(0deg)';
        } else {
            content.style.display = 'block';
            arrow.style.transform = 'rotate(180deg)';
        }
    }

    window.onload = function() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        let targetId = 'windowsApps';
        if (/android/i.test(ua)) targetId = 'androidApps';
        else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) targetId = 'iosApps';
        
        const content = document.getElementById(targetId);
        const arrow = document.getElementById('arrow-' + targetId);
        const header = document.getElementById('header-' + targetId);
        if (content && header && arrow) {
            content.style.display = 'block';
            arrow.style.transform = 'rotate(180deg)';
            header.classList.add('active-os');
        }
    };
</script>

</body>
</html>
