<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد اشتراک اختصاصی</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { 
           background: #060913;
           background-image: var(--dynamic-bg, radial-gradient(circle at 50% -10%, #1e1b4b 0%, #060913 100%));
           color: #f8fafc; 
           padding: 30px 16px; 
           display: flex; 
           justify-content: center; 
           align-items: center; 
           min-height: 100vh; 
           transition: background-image 0.6s ease;
        }
        .wrapper { width: 100%; max-width: 420px; }
        
        .brand-title {
           text-align: center;
           font-size: 16px;
           font-weight: 800;
           color: #f8fafc;
           margin-bottom: 12px;
           letter-spacing: 0.5px;
           text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
 
        .card { 
           background: rgba(255, 255, 255, 0.03); 
           backdrop-filter: blur(20px);
           -webkit-backdrop-filter: blur(20px);
           border: 1px solid rgba(255, 255, 255, 0.08);
           border-radius: 24px; 
           padding: 20px 22px; 
           box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); 
           margin-bottom: 14px; 
        }
        .sub-time-card { 
            font-size: 13px; 
            color: #f8fafc; 
           font-weight: 600;
        }
        .badge-time { 
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.1));
            color: #f8fafc;
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }
        .sub-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .sub-title { font-weight: 700; font-size: 14px; color: #f8fafc; display: flex; align-items: center; gap: 8px; }
        .btn-group { display: flex; gap: 8px; }
        
        .action-btn { 
            background: rgba(255, 255, 255, 0.06); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 8px 14px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 13px; 
            color: #e2e8f0; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
       .action-btn.primary { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: #fff; border: none; }
 
       .link-box-input {
            width: 100%;
           background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
           border-radius: 12px;
            padding: 10px 14px;
            color: #38bdf8;
            font-size: 12px;
            direction: ltr;
           text-align: left;
            outline: none;
        }
 
       .qrcode-container { display: flex; justify-content: center; align-items: center; margin-top: 15px; display: none; }
       .qrcode-container img { border-radius: 16px; padding: 12px; background: #ffffff; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
 
        .os-section { margin-bottom: 6px; }
       .accordion-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 600; 
            color: #cbd5e1; 
            padding: 12px 14px; 
           background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
           border-radius: 14px;
           margin-bottom: 8px;
           transition: all 0.2s ease;
        }
       .accordion-header.active-os { 
            background: rgba(99, 102, 241, 0.1); 
           border-color: rgba(99, 102, 241, 0.3);
            color: #f8fafc;
        }
        .arrow-icon { font-size: 11px; color: #64748b; transition: transform 0.3s ease; }
        
       .accordion-content { display: none; margin-top: 6px; margin-bottom: 10px; padding: 0 4px; }
        .app-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
           background: rgba(15, 23, 42, 0.6); 
            padding: 12px 16px; 
           border-radius: 14px; 
           margin-bottom: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .app-info { display: flex; align-items: center; gap: 10px; }
        .app-name { font-size: 13px; font-weight: 700; color: #f8fafc; }
        .badge-suggest { background: rgba(56, 189, 248, 0.12); color: #38bdf8; font-size: 10px; padding: 4px 8px; border-radius: 8px; font-weight: 700; }
        .dl-btn { 
            background: rgba(255, 255, 255, 0.06); 
            color: #e2e8f0; 
            padding: 7px 16px; 
           border-radius: 10px; 
           text-decoration: none; 
            font-size: 12px; 
           font-weight: 600; 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
 
        .support-card { display: flex; justify-content: space-between; align-items: center; }
        .support-title { font-weight: 600; font-size: 13px; color: #f8fafc; }
        .support-link { color: #38bdf8; font-weight: 700; font-size: 13px; text-decoration: none; direction: ltr; background: rgba(56, 189, 248, 0.08); padding: 7px 16px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.2); }
 
        .thank-you-box { 
           background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); 
           border-radius: 20px; 
            padding: 18px; 
           text-align: center; 
            color: #ffffff; 
            font-size: 13px; 
           font-weight: 600; 
           box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body>
 
<div class="wrapper">
    <!-- ========================================== -->
    <!-- اسم را اینجا وارد کنید (بین علامت‌های نقل‌قول زیر) -->
    <!-- ========================================== -->
    <div class="brand-title">Elham_ho</div>
 
    <!-- بخش مدت زمان و حجم سرویس -->
    <div class="card sub-time-card" style="display: flex; gap: 10px;">
        <div style="flex: 1; display: flex; justify-content: space-between; align-items: center;">
           <span>مدت زمان</span>
            <div class="badge-time">
               <!-- ✏️ [۱- مدت زمان اشتراک]: عدد ماه را در این قسمت تغییر دهید -->
               <span>2</span>
               <span>ماه</span>
            </div>
        </div>
        <div style="flex: 1; display: flex; justify-content: space-between; align-items: center; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 10px;">
           <span>حجم سرویس</span>
            <div class="badge-time" style="background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(14, 165, 233, 0.1)); color: #f8fafc; border-color: rgba(56, 189, 248, 0.3);">
               <!-- ✏️ [۲- حجم سرویس]: مقدار حجم را در این قسمت تغییر دهید -->
               <span>10</span>
               <span>گیگ</span>
            </div>
        </div>
    </div>
 
    <!-- لینک اشتراک -->
    <div class="card">
        <div class="sub-header">
            <span class="sub-title">🔗 لینک اشتراک (SUB)</span>
            <div class="btn-group">
               <button class="action-btn" onclick="toggleQR()">🔲 QR</button>
               <button class="action-btn primary" id="copyBtn" onclick="copySubLink()">کپی لینک</button>
            </div>
        </div>
        <input type="text" id="subLinkInput" class="link-box-input" readonly onclick="this.select()">
        <div class="qrcode-container" id="qrcode"></div>
    </div>
 
    <!-- بخش برنامه‌ها با تشخیص خودکار نوع دستگاه -->
    <div class="card">
        <!-- iOS -->
        <div class="os-section">
            <div class="accordion-header" id="header-iosApps" onclick="toggleAccordion('iosApps')">
               <span>🍏 iOS (آیفون)</span>
               <span class="arrow-icon" id="arrow-iosApps">▼</span>
            </div>
            <div class="accordion-content" id="iosApps">
               <div class="app-item">
                   <div class="app-info">
                       <span class="app-name">Streisand (آخرین نسخه)</span>
                       <span class="badge-suggest">پیشنهادی</span>
                   </div>
                   <a href="https://apps.apple.com/us/app/streisand/id6450534064" class="dl-btn" target="_blank">دانلود</a>
               </div>
            </div>
        </div>
 
        <!-- اندروید -->
        <div class="os-section">
            <div class="accordion-header" id="header-androidApps" onclick="toggleAccordion('androidApps')">
               <span>🤖 اندروید</span>
               <span class="arrow-icon" id="arrow-androidApps">▼</span>
            </div>
            <div class="accordion-content" id="androidApps">
               <div class="app-item">
                   <div class="app-info"><span class="app-name">v2rayNG (آخرین نسخه)</span></div>
                   <a href="https://github.com/2dust/v2rayNG/releases" class="dl-btn" target="_blank">دانلود</a>
               </div>
            </div>
        </div>
 
        <!-- ویندوز -->
        <div class="os-section">
            <div class="accordion-header" id="header-windowsApps" onclick="toggleAccordion('windowsApps')">
               <span>💻 ویندوز</span>
               <span class="arrow-icon" id="arrow-windowsApps">▼</span>
            </div>
            <div class="accordion-content" id="windowsApps">
               <div class="app-item">
                   <div class="app-info"><span class="app-name">v2rayN (آخرین نسخه کامل)</span></div>
                   <a href="https://github.com/2dust/v2rayN/releases" class="dl-btn" target="_blank">دانلود</a>
               </div>
            </div>
        </div>
    </div>
 
    <!-- پشتیبانی -->
    <div class="card support-card">
        <span class="support-title">پشتیبانی تلگرام</span>
        <a href="https://t.me/Turbo_Canfing" target="_blank" class="support-link">@Turbo_Canfing</a>
    </div>
 
    <div class="thank-you-box">
        🙏بابت خرید و اعتماد شما متشکرم
    </div>
</div>
 
<script>
    // ==========================================
    // لینک را اینجا کپی کنید (بین علامت‌های نقل‌قول زیر)
    // ==========================================
    const subLink = "https://racocloud.com/sub/djMsMTA2MzEsMTc4NDMxMDgyNQ6aa23c3aa0";
 
   document.getElementById('subLinkInput').value = subLink;
 
    let qrGenerated = false;
    function toggleQR() {
        const qrContainer = document.getElementById('qrcode');
        if (qrContainer.style.display === 'flex') {
           qrContainer.style.display = 'none';
        } else {
           qrContainer.style.display = 'flex';
            if (!qrGenerated) {
                new QRCode(qrContainer, {
                    text: subLink,
                    width: 150,
                    height: 150,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.M
                });
               qrGenerated = true;
            }
        }
    }
 
    function copySubLink() {
        const inputElement = document.getElementById('subLinkInput');
       inputElement.select();
       inputElement.setSelectionRange(0, 99999);
        
        try {
           document.execCommand('copy');
            const btn = document.getElementById('copyBtn');
           btn.innerText = "کپی شد! ✓";
           btn.style.background = "#059669";
           setTimeout(() => {
               btn.innerText = "کپی لینک";
               btn.style.background = "linear-gradient(135deg, #6366f1 0%, #a855f7 100%)";
            }, 2000);
        } catch (err) {
           prompt("لینک اشتراک شما:", subLink);
        }
    }
 
    function toggleAccordion(id) {
        const content = document.getElementById(id);
        const arrow = document.getElementById('arrow-' + id);
        const header = document.getElementById('header-' + id);
        if (content.style.display === 'block') {
           content.style.display = 'none';
           arrow.style.transform = 'rotate(0deg)';
        } else {
           content.style.display = 'block';
           arrow.style.transform = 'rotate(180deg)';
        }
    }
 
    window.onload = function() {
        const bgList = [
           "radial-gradient(circle at 50% -10%, #60a5fa 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #34d399 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #f472b6 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #fbbf24 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #38bdf8 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #a78bfa 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #f87171 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #4ade80 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #818cf8 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #e879f9 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #2dd4bf 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #fb923c 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #acc8e5 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #facc15 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #c084fc 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #38e0b8 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #ff85a1 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #67e8f9 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #fbcfe8 0%, #060913 100%)",
           "radial-gradient(circle at 50% -10%, #fde047 0%, #060913 100%)"
        ];
 
        const randomBg = bgList[Math.floor(Math.random() * bgList.length)];
       document.body.style.setProperty('--dynamic-bg', randomBg);
 
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        let targetId = 'windowsApps';
 
        if (/android/i.test(ua)) {
            targetId = 'androidApps';
        } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
            targetId = 'iosApps';
        } else if (/Win/i.test(navigator.platform)) {
            targetId = 'windowsApps';
        }
 
        const content = document.getElementById(targetId);
        const arrow = document.getElementById('arrow-' + targetId);
        const header = document.getElementById('header-' + targetId);
        
        if (content && header && arrow) {
           content.style.display = 'block';
           arrow.style.transform = 'rotate(180deg)';
           header.classList.add('active-os');
        }
    };
</script>
 
</body>
</html>
